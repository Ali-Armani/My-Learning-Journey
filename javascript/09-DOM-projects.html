<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
</head>
<body>

  <p>
    YouTube Subscribe Button
  </p>

  <button onclick="
    subscribe();
  " class="js-subscribe-btn">Subscribe</button>

  <p>
    Amazon Shipping Calculator
  </p>
  <input placeholder="Cost of Order" class="js-cost-input" onkeydown="
    handleCostKeydown(event);
  ">
  
  <script>

    function subscribe() {
      let subscribeButtonElement = document.querySelector('.js-subscribe-btn')
      if (subscribeButtonElement.innerHTML === 'Subscribe') {
        subscribeButtonElement.innerHTML = 'Subscribed'
      } else {
        subscribeButtonElement.innerHTML = 'Subscribe'
      }
    }

  </script>

</body>
</html>
