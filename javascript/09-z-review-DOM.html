<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 DOM review</title>
</head>
<body>

  <p>
    YouTube Subscribe Button
  </p>

  <button onclick="
  getButtonElement();
  "
  class="js-subscribe-button"
  >Subscribe</button>

  <script>

      let subsribeButtonElement = document.querySelector('.js-subscribe-button');

    function getButtonElement() {
      if (subsribeButtonElement.innerHTML === 'Subscribe') {
        subsribeButtonElement.innerHTML = 'Subscribed'
      } else {
        subsribeButtonElement.innerHTML = 'Subscribe'
      }
    }
    
  </script>

</body>
</html>
