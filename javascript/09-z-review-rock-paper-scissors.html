<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review 09</title>
</head>
<body>

    <button onclick="
    playGame('Rock');
  ">Rock</button>

  <button onclick="
    playGame('Paper');
  ">Paper</button>

  <button onclick="
    playGame('Scissors');
  ">Scissors</button>

  <p class="js-result"></p>

  <p class="js-moves"></p>

  <p class="js-score"></p>

  <button onclick="
    resetScore();
    updateScoreElement();
  ">Reset</button>

  <script>

    let computerMove = '';

    function playGame(playerMove) {

      let randomNumber = Math.random();
      
      if (randomNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNumber < 2 / 3) {
        computerMove = 'Paper';
      } else {
        computerMove = 'Scissors';
      }

      let result = '';

      if (computerMove === playerMove) {
        result = 'Draw.';
        score.draws += 1;
      } else if (
        (computerMove === 'Rock' && playerMove === 'Paper') ||
        (computerMove === 'Paper' && playerMove === 'Scissors') ||
        (computerMove === 'Scissors' && playerMove === 'Rock')
      ) {
        result = 'You win!';
        score.wins += 1;
      } else {
        result = 'You lose.'
        score.losses += 1;
      }

      localStorage.setItem('score', JSON.stringify(score));

      document.querySelector('.js-result').innerHTML = result;

      document.querySelector('.js-moves').innerHTML = `You picked ${playerMove}. Computer picked ${computerMove}.`;

      document.querySelector('.js-score').innerHTML = `
      Wins: ${score.wins} <br>
      Losses: ${score.losses} <br>
      Draws: ${score.draws}
      `;

      updateScoreElement();

    }
    
  </script>
  
</body>
</html>
