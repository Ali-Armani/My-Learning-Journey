                                              /* typeof */

                                /* Shortcuts for Re-assigning Variables*/
    let variable4 = 60;
    variable4 += 6;
    console.log(variable4);
    variable4 -= 6;
    console.log(variable4);
    variable4 *= 6;
    console.log(variable4);
    variable4 /= 6;

    console.log(variable4);
