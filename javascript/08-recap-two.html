<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recap 2</title>
</head>

<body>

  <button onclick="
  playGame('Rock')
  ">Rock</button>


  <button onclick="
  playGame('Paper')
  ">Paper</button>


  <button onclick="
  playGame('Scissors')
  ">Scissors</button>


  <button onclick="

  winTimes = 0;
  loseTimes = 0;
  tieTimes = 0;

  alert('Score reset!');

  ">Reset Score</button>
  

  <script>

    let winTimes = 0;
    let loseTimes = 0;
    let tieTimes = 0;

    function playGame(playerMove) {

      let computerMove = '';

      let randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'Scissors';
      }

      console.log(computerMove);

      let result = '';

      if (computerMove === 'Rock') {
        result = 'You lose.';
      } else if (computerMove === 'Paper') {
        result = 'You win!';
      } else if (computerMove === 'Scissors') {
        result = 'Tie.';
      }

      if (result === 'You win!') {
        winTimes += 1;
      } else if (result === 'You lose.') {
        loseTimes += 1;
      } else if (result === 'Tie.') {
        tieTimes += 1;
      }

      alert(`You picked ${playerMove}. The computer picked ${computerMove}. ${result}
Wins: ${winTimes}. Loses: ${loseTimes}. Ties: ${tieTimes}.`);
        }

  </script>

</body>
</html>
