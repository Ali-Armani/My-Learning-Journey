    computerMove = 'Paper';

    computerMove = 'Scissors';
  }

  let result = '';

  if (computerMove === 'Rock') {
    result = 'Tie.';
  } else if (computerMove === 'Paper') {
    result = 'You lose.';
  } else if (computerMove === 'Scissors') {
    result = 'You win!';
  }
  
  if (result === 'You win!') {
    winTimes += 1;
  } else if (result === 'You lose.') {
    loseTimes += 1;
  } else if (result === 'Tie.') {
    tieTimes += 1;
  }

  alert(`You picked Rock. The computer picked ${computerMove}. ${result}
Wins: ${winTimes}. Loses: ${loseTimes}. Ties: ${tieTimes}.`);

  ">Rock</button>
