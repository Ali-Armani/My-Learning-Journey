<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>

  <style>

    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-left: 1.5rem;
      margin-right: 1.5rem;
    }

    .btn {
      padding: 1.8rem;
      border: 1rem;
      border-radius: 50%;
      font-size: 1.2rem;
      background-color: rgb(8, 20, 101);
      color: rgb(255, 255, 255);
      margin-top: 3.5rem;
    }

    .reset-btn {
      padding: 1.5rem;
      border: 1rem;
      border-radius: 50%;
      font-size: 1.2rem;
      background-color: rgb(8, 118, 21);
      color: aliceblue;
      margin-top: 5rem;
      margin-left: 40%;
    }
    
  </style>
  
</head>

<body>

  <h1>Rock Paper Scissors</h1>

  <button onclick="playGame('Rock')">
    Rock
  </button>

  <button onclick="playGame('Paper')">
    Paper
  </button>

  <button onclick="playGame('Scissors')">
    Scissors
  </button>

  <button onclick="resetScore()">
    Reset Score
  </button>


  <script>

    let winTimes = 0;
    let loseTimes = 0;
    let tieTimes = 0;


    function playGame(playerMove) {

      let randomNumber = Math.random();

      let computerMove = '';

      if (randomNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNumber < 2 / 3) {
        computerMove = 'Paper';
      } else {
        computerMove = 'Scissors';
      }


      let result = '';


      if (playerMove === computerMove) {

        result = 'Tie.';
        tieTimes++;

      } 
      else if (
        (playerMove === 'Rock' && computerMove === 'Scissors') ||
        (playerMove === 'Paper' && computerMove === 'Rock') ||
        (playerMove === 'Scissors' && computerMove === 'Paper')
      ) {

        result = 'You win!';
        winTimes++;

      } 
      else {

        result = 'You lose.';
        loseTimes++;

      }


      alert(
        `You picked ${playerMove}.
Computer picked ${computerMove}.

** ${result} **

Wins: ${winTimes}
Loses: ${loseTimes}
Ties: ${tieTimes}`
      );

    }

    function resetScore() {

      winTimes = 0;
      loseTimes = 0;
      tieTimes = 0;

      alert('Score reset.');

    }


  </script>

</body>

</html>
