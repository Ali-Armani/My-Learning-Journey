<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>
<body>
  <script>
    const product = {
      name: 'socks',
      price: 1090
    };
    console.log(product);
    console.log(product.name);
    console.log(product.price);

    product.name = 'shirts';
    product.price = 2390;
    console.log(product);

    product.newProperty = true;
    console.log(product);

    delete product.newProperty;
    console.log(product);

    console.log(typeof product);

    const product2 = {
      name: 'shirt',
      ['delivery-time']: '3 days',
      rating: {
        stars: 4.5,
        count: 87
      },
      fun: function function1() {
        console.log('function inside object = method');
      }
    };
    console.log(product2);
    console.log(product2.name);
    console.log(product2['name']);
    console.log(product2['delivery-time']);

    console.log(product2.rating);
    console.log(product2.rating.stars);
    console.log(product2.rating.count);

    product2.fun();
    console.log(typeof console);
    console.log(typeof console.log);
    console.log(typeof Math);
    console.log(typeof Math.random);
    console.log(typeof JSON);
    console.log(typeof JSON.stringify);

    console.log(JSON.stringify(product2));
    console.log(typeof JSON.stringify(product2));
    console.log(JSON.parse(JSON.stringify(product2)));

    console.log('hello world'.length);
    console.log('hello world'.toUpperCase());



    // ========== Objects & References ==========
    const object1 = {
      message: 'hello'
    };

    const object2 = object1;
    console.log(object2);

    object1.message = 'Good job!';
    console.log(object1);

    const object3 = {
      message: 'Good job!'
    };

    console.log(object1 === object2);
    console.log(object3 === object2);
    console.log(object3 === object1);

    

    // ========== Destructuring ==========
    const object4 = {
      message: 'Excellent!',
      price: 799
    };

    // let message = object4.message;
    const {message, price} = object4;
    console.log(message);
    console.log(price);
    console.log(message, price);


    
    // ========== Shorthand Property ==========
    const object5 = {
      // message: message
      message
    }
    console.log(object5);

  </script>
</body>
</html>
