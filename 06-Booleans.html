<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booleans</title>
</head>
<body>
   <script>
    true
    false

    console.log(3 > 5);
    console.log(3 < 5);
    console.log(3 === 5);
    console.log(3 !== 5);
    console.log(3 <= 5);
    console.log(3 >= 5);
    console.log(5 == '5');
    console.log(5 === '5');
    console.log(3 != '3');
    console.log(3 !== '3');
    
    if (false) {
      console.log('false');
    } else {
      console.log('true');
    }

    if (true) {
      console.log('true');
    } else {
      console.log('false');
    }

    if (17 >= 18) {
      console.log('You can drive.');
      console.log('Congrats!');
    } else if (17 >= 16) {
      console.log('Almost there!');
    } else {
      console.log('You can NOT drive!');
    }

    const age = 13;
    if (age >= 18) {
      console.log('You can drive.');
      console.log('Congrats!');
    } else if (age >= 16) {
      console.log('Almost there!');
    } else {
      console.log('You can NOT drive!');
    }

    const result = true ? 'truthy' : 'falsy';
    console.log(result);

    const result2 = 0 ? 'truthy' : 'falsy';
    console.log(result2);

    const result3 = '' ? 'truthy' : 'falsy';
    console.log(result3);

    const result4 = undefined ? 'truthy' : 'falsy';
    console.log(result4);

    const result5 = NaN ? 'truthy' : 'falsy';
    console.log(result5);

    const result6 = null ? 'truthy' : 'falsy';
    console.log(result6);

    const result7 = false ? 'truthy' : 'falsy';
    console.log(result7);

    true && console.log('hello');

    false && console.log('hello');

    const message = 5 && 'hello';
    console.log(message);

    const currency = 'EUR' || 'USD';
    console.log(currency);

    const currency2 = undefined || 'USD';
    console.log(currency2);

   </script>
</body>
</html>
