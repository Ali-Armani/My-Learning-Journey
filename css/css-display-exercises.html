<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Display block, inline, inline-block</title>

  <style>

    .box1 {
      display: block;
      border: 1px solid lightblue;
      width: 20rem;
      height: 15rem;
      margin: 1rem;
      padding: 1rem;
    }

    .box2 {
      display: inline;
      border: 1px solid lightpink;
      /* "Margin & Padding" do NOT work for "inline" elements */
    /*
      width: 20rem;
      height: 15rem;
    */
      margin: 1rem;
      padding: 1rem;
    }

    .box3 {
      display: inline-block;
      border: 1px solid red;
      width: 20rem;
      height: 15rem;
      margin: 1rem;
      padding: 1rem;
    }

  </style>

</head>

<body>

  <div class="box1">Box 1</div>
  <div class="box2">Box 2</div>
  <div class="box3">Box 3</div>
</body>
</html>
