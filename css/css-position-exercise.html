<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Position Absolute, Fixed, Relative etc</title>

  <style>

    /*
    To make boxes in a horizontal row, we use:
      display: inline-block;
      position: relative;
    */

    .box1 {
      display: inline-block;
      position: relative;
      border: 1px solid red;
      width: 18rem;
      height: 14rem;
      margin: 1rem;
      padding: 1rem;
    }

    .box2 {
      display: inline-block;
      position: relative;
      border: 1px solid blue;
      width: 18rem;
      height: 14rem;
      margin: 1rem;
      padding: 1rem;
    }

    .box3 {
      display: inline-block;
      position: relative;
      border: 1px solid lightcoral;
      width: 18rem;
      height: 14rem;
      margin: 1rem;
      padding: 1rem;
    }

    .box4 {
      display: inline-block;
      position: relative;
      border: 1px solid green;
      width: 18rem;
      height: 14rem;
      margin: 1rem;
      padding: 1rem;
    }

  </style>

</head>

<body>

  <div class="box1">Box 1</div>
  <div class="box2">Box 2</div>
  <div class="box2">Box 3</div>
  <div class="box4">Box 4</div>

</body>
</html>
